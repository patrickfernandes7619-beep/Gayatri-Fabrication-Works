<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gayatri Fabrication Works</title>
    <meta name="description" content="Gayatri Fabrication Works - Commercial Kitchen Equipments for Hotels, Restaurants, Bar & Industrial Canteens manufacturers in Mumbai, Maharashtra." />
    <meta property="og:title" content="Gayatri Fabrication Works" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/jpeg" href="./images/gayatri-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // When served on static production web hosting (cPanel / Apache / GitHub Pages)
      // without Vite development server active, load the compiled production bundle.
      (function() {
        var host = window.location.hostname;
        var isDevServer = host === 'localhost' || host === '127.0.0.1' || host.indexOf('run.app') !== -1;
        if (!isDevServer && !document.querySelector('script[src*="app.js"]')) {
          var s = document.createElement('script');
          s.id = 'cpanel-prod-script';
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './dist/assets/app.js';
          document.body.appendChild(s);

          var l = document.createElement('link');
          l.id = 'cpanel-prod-style';
          l.rel = 'stylesheet';
          l.href = './dist/assets/index.css';
          document.head.appendChild(l);
        }
      })();
    </script>
  </body>
</html>
